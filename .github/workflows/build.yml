name: Build Switch NRO

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build_nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        dkp-pacman -Syu --noconfirm --needed switch-sdl2 switch-openal-soft switch-mesa switch-libdrm_nouveau switch-glad switch-libvorbis switch-libogg switch-libmad switch-libjpeg-turbo switch-curl switch-mbedtls switch-zlib

    - name: Get short SHA
      id: slug
      run: |
        printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

    - name: Build OpenArenaNX
      run: make -f Makefile.nx -j$(nproc)

    - name: Push NRO artifact
      uses: actions/upload-artifact@v4
      with:
        name: openarenanx-build_${{ steps.slug.outputs.sha8 }}
        path: OpenArenaNX.nro
        if-no-files-found: error
